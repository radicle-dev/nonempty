[package]
name = "nonempty"
version = "0.12.0"
description = "Correct by construction non-empty vector"
edition = "2024"
license = "MIT"
repository = "https://github.com/radicle-dev/nonempty"
rust-version = "1.87"

[dependencies]
serde = { features = ["derive", "alloc"], default-features = false, optional = true, version = "1" }
arbitrary = { features = ["derive"], optional = true, version = "1" }

[features]
default = ["std"]
std = []
serialize = ["dep:serde"]
arbitrary = ["dep:arbitrary"]

[dev-dependencies]
serde_json = "1"

[lints.clippy]
missing_const_for_fn = "warn"
